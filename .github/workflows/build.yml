name: Java CI with Gradle

on:
  push:
    branches: [ "main", "port/26.3" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: 'jdk'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Remove *-sources.jar
        run: rm -f ./build/libs/*-sources.jar || true

      - name: Read mod version for the release name
        id: modmeta
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create automatic release
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "latest-26.3"
          prerelease: false
          name: "Latest Build (${{ steps.modmeta.outputs.version }})"
          files: ./build/libs/*.jar
